[project]
name = "nooa-factor-demo"
version = "0.1.0"
description = "Minimal NOOA research agent for run-level sensor features"
requires-python = ">=3.12,<3.14"
dependencies = [
  "nooa",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "pyarrow>=18",
  "python-dotenv>=1,<2",
  "polars>=1.30,<2",
  "matplotlib>=3.9,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psutil>=6,<8",
  "scipy>=1.17,<2",
  "statsmodels>=0.15,<0.16",
  "aeon>=1.6,<2",
]

[project.scripts]
factor-demo = "factor_demo.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]
docs = [
    "furo>=2025.12.19",
    "jieba>=0.42.1",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinxcontrib-mermaid>=2.1.1",
]

[tool.uv.sources]
nooa = { git = "https://github.com/NVIDIA-NeMo/labs-OO-Agents.git", rev = "1454b78c8f0a85c97eab1c6a91cc8cfc95b34de5" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factor_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# NOOA uses ellipsis bodies to identify LLM generation methods.
ignore = ["PIE790"]
