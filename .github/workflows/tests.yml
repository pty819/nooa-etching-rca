name: Runtime checks

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, backend: auto}
          - {os: ubuntu-24.04-arm, backend: auto}
          - {os: ubuntu-24.04, backend: bubblewrap}
          - {os: macos-15, backend: auto}
    name: python (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    env:
      FACTOR_LINUX_BACKEND: ${{ matrix.backend }}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.3'
      - name: Install locked runtime and test dependencies
        run: uv sync --frozen --group dev
      - name: Install bubblewrap (PID ns for Landlock; full backend when selected)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          if test -f /sys/module/apparmor/parameters/enabled && grep -q Y /sys/module/apparmor/parameters/enabled; then
            sudo install -m 644 deploy/apparmor/bwrap /etc/apparmor.d/nooa-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/nooa-bwrap
          fi
      - name: Inspect actual execution backend
        run: uv run --no-sync factor-demo doctor --warm-font-cache
      - name: Lint and format
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff format --check src tests scripts
      - name: Generate the explicit historical export fixture
        run: uv run --no-sync factor-demo generate-etch --data data/etching-v2 --runs 90 --profile legacy_v2
      - name: Real worker, evidence and orchestration regressions (no provider keys)
        run: uv run --no-sync pytest -q --durations=15
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --registry=https://registry.npmjs.org
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend --audit-level=moderate --registry=https://registry.npmjs.org
